name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  checks: write

env:
  FOUNDRY_PROFILE: ci

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Check Error Selectors
        run: ./.github/workflows/check-error-selectors.sh

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Run Forge build
        run: forge build --deny notes

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: forge-build-cache
          path: |
            out/
            cache/
          retention-days: 1

  sizes:
    name: Sizes
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: forge-build-cache

      - name: Check contract sizes
        run: forge build --sizes

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    outputs:
      snapshots_changed: ${{ steps.snapshots.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: forge-build-cache

      - name: Show Forge version
        run: forge --version

      - name: Run Forge tests
        run: forge test -vvv

      - name: Capture updated gas snapshots
        id: snapshots
        if: success() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          if git diff --quiet -- snapshots/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mkdir -p "$RUNNER_TEMP/gas-snapshots"
          cp snapshots/*.json "$RUNNER_TEMP/gas-snapshots/"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Upload updated gas snapshots
        if: steps.snapshots.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: updated-gas-snapshots
          path: ${{ runner.temp }}/gas-snapshots/*.json
          retention-days: 1

  snapshot-update:
    name: Snapshot Update
    needs: [lint, sizes, test]
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.test.outputs.snapshots_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ github.token }}
          fetch-depth: 0

      - name: Download updated gas snapshots
        uses: actions/download-artifact@v4
        with:
          name: updated-gas-snapshots
          path: snapshots

      - name: Commit updated gas snapshots
        id: snapshot_commit
        shell: bash
        run: |
          if git diff --quiet -- snapshots/; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          old_sha="$(git rev-parse HEAD)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshots/
          git commit -m "chore: auto-update gas snapshots"

          new_sha="$(git rev-parse HEAD)"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

          echo "committed=true" >> "$GITHUB_OUTPUT"
          echo "old_sha=$old_sha" >> "$GITHUB_OUTPUT"
          echo "new_sha=$new_sha" >> "$GITHUB_OUTPUT"

      - name: Mark inherited checks on snapshot-only commit
        if: steps.snapshot_commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          REPO="${{ github.repository }}"
          OLD_SHA="${{ steps.snapshot_commit.outputs.old_sha }}"
          NEW_SHA="${{ steps.snapshot_commit.outputs.new_sha }}"
          DETAILS_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          SUMMARY="Snapshot-only auto-update generated from passing CI on ${OLD_SHA:0:7}. No source files changed."

          dependency_review_conclusion="$(gh api "repos/$REPO/commits/$OLD_SHA/check-runs" --jq '.check_runs[] | select(.name == "dependency-review") | .conclusion' | head -n 1 || true)"
          if [ -z "$dependency_review_conclusion" ]; then
            dependency_review_conclusion="success"
          fi

          create_check_run() {
            local name="$1"
            local conclusion="$2"
            gh api "repos/$REPO/check-runs" \
              --method POST \
              -f name="$name" \
              -f head_sha="$NEW_SHA" \
              -f status="completed" \
              -f conclusion="$conclusion" \
              -f details_url="$DETAILS_URL" \
              -f output[title]="Inherited result after snapshot auto-update" \
              -f output[summary]="$SUMMARY" >/dev/null
          }

          create_check_run "Build" "success"
          create_check_run "Lint" "success"
          create_check_run "Sizes" "success"
          create_check_run "Test" "success"
          create_check_run "dependency-review" "$dependency_review_conclusion"
