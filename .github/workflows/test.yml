name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FOUNDRY_PROFILE: ci

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check dependency access secrets
        env:
          DEPENDENCIES_APP_ID: ${{ secrets.DEPENDENCIES_APP_ID }}
          DEPENDENCIES_PRIVATE_KEY: ${{ secrets.DEPENDENCIES_PRIVATE_KEY }}
        run: |
          if [ -z "$DEPENDENCIES_APP_ID" ] || [ -z "$DEPENDENCIES_PRIVATE_KEY" ]; then
            echo "Missing DEPENDENCIES_APP_ID or DEPENDENCIES_PRIVATE_KEY secret for private dependency access." >&2
            exit 1
          fi

      - name: Create dependencies token
        uses: actions/create-github-app-token@v3
        id: dependencies-token
        with:
          app-id: ${{ secrets.DEPENDENCIES_APP_ID }}
          private-key: ${{ secrets.DEPENDENCIES_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            aave-delivery-infrastructure
          permission-contents: read

      - name: Initialize submodules
        env:
          DEPENDENCIES_TOKEN: ${{ steps.dependencies-token.outputs.token }}
        run: |
          git config --global url."https://x-access-token:${DEPENDENCIES_TOKEN}@github.com/aave/aave-delivery-infrastructure".insteadOf "https://github.com/aave/aave-delivery-infrastructure"
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Check Error Selectors
        run: ./.github/workflows/check-error-selectors.sh

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check dependency access secrets
        env:
          DEPENDENCIES_APP_ID: ${{ secrets.DEPENDENCIES_APP_ID }}
          DEPENDENCIES_PRIVATE_KEY: ${{ secrets.DEPENDENCIES_PRIVATE_KEY }}
        run: |
          if [ -z "$DEPENDENCIES_APP_ID" ] || [ -z "$DEPENDENCIES_PRIVATE_KEY" ]; then
            echo "Missing DEPENDENCIES_APP_ID or DEPENDENCIES_PRIVATE_KEY secret for private dependency access." >&2
            exit 1
          fi

      - name: Create dependencies token
        uses: actions/create-github-app-token@v3
        id: dependencies-token
        with:
          app-id: ${{ secrets.DEPENDENCIES_APP_ID }}
          private-key: ${{ secrets.DEPENDENCIES_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            aave-delivery-infrastructure
          permission-contents: read

      - name: Initialize submodules
        env:
          DEPENDENCIES_TOKEN: ${{ steps.dependencies-token.outputs.token }}
        run: |
          git config --global url."https://x-access-token:${DEPENDENCIES_TOKEN}@github.com/aave/aave-delivery-infrastructure".insteadOf "https://github.com/aave/aave-delivery-infrastructure"
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Run Forge build
        run: forge build --deny notes

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: forge-build-cache
          path: |
            out/
            cache/
          retention-days: 1

  sizes:
    name: Sizes
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check dependency access secrets
        env:
          DEPENDENCIES_APP_ID: ${{ secrets.DEPENDENCIES_APP_ID }}
          DEPENDENCIES_PRIVATE_KEY: ${{ secrets.DEPENDENCIES_PRIVATE_KEY }}
        run: |
          if [ -z "$DEPENDENCIES_APP_ID" ] || [ -z "$DEPENDENCIES_PRIVATE_KEY" ]; then
            echo "Missing DEPENDENCIES_APP_ID or DEPENDENCIES_PRIVATE_KEY secret for private dependency access." >&2
            exit 1
          fi

      - name: Create dependencies token
        uses: actions/create-github-app-token@v3
        id: dependencies-token
        with:
          app-id: ${{ secrets.DEPENDENCIES_APP_ID }}
          private-key: ${{ secrets.DEPENDENCIES_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            aave-delivery-infrastructure
          permission-contents: read

      - name: Initialize submodules
        env:
          DEPENDENCIES_TOKEN: ${{ steps.dependencies-token.outputs.token }}
        run: |
          git config --global url."https://x-access-token:${DEPENDENCIES_TOKEN}@github.com/aave/aave-delivery-infrastructure".insteadOf "https://github.com/aave/aave-delivery-infrastructure"
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: forge-build-cache

      - name: Check contract sizes
        run: forge build --sizes

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check dependency access secrets
        env:
          DEPENDENCIES_APP_ID: ${{ secrets.DEPENDENCIES_APP_ID }}
          DEPENDENCIES_PRIVATE_KEY: ${{ secrets.DEPENDENCIES_PRIVATE_KEY }}
        run: |
          if [ -z "$DEPENDENCIES_APP_ID" ] || [ -z "$DEPENDENCIES_PRIVATE_KEY" ]; then
            echo "Missing DEPENDENCIES_APP_ID or DEPENDENCIES_PRIVATE_KEY secret for private dependency access." >&2
            exit 1
          fi

      - name: Create dependencies token
        uses: actions/create-github-app-token@v3
        id: dependencies-token
        with:
          app-id: ${{ secrets.DEPENDENCIES_APP_ID }}
          private-key: ${{ secrets.DEPENDENCIES_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            aave-delivery-infrastructure
          permission-contents: read

      - name: Initialize submodules
        env:
          DEPENDENCIES_TOKEN: ${{ steps.dependencies-token.outputs.token }}
        run: |
          git config --global url."https://x-access-token:${DEPENDENCIES_TOKEN}@github.com/aave/aave-delivery-infrastructure".insteadOf "https://github.com/aave/aave-delivery-infrastructure"
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: forge-build-cache

      - name: Show Forge version
        run: forge --version

      - name: Run Forge tests
        run: forge test -vvv

  pigeon-preprod:
    name: Pigeon Preprod
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      ALCHEMY_KEY: ${{ secrets.ALCHEMY_KEY || secrets.ALCHEMY_API_KEY }}
      ADI_FORK_MODE: deployed
      ADI_DEPLOYMENT_ENV: preprod
      ADI_DEPLOY_REF: pull/2/head
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check RPC secret
        run: |
          if [ -z "$ALCHEMY_KEY" ]; then
            echo "Missing ALCHEMY_KEY or ALCHEMY_API_KEY secret for Pigeon fork tests." >&2
            exit 1
          fi

      - name: Check dependency access secrets
        env:
          DEPENDENCIES_APP_ID: ${{ secrets.DEPENDENCIES_APP_ID }}
          DEPENDENCIES_PRIVATE_KEY: ${{ secrets.DEPENDENCIES_PRIVATE_KEY }}
        run: |
          if [ -z "$DEPENDENCIES_APP_ID" ] || [ -z "$DEPENDENCIES_PRIVATE_KEY" ]; then
            echo "Missing DEPENDENCIES_APP_ID or DEPENDENCIES_PRIVATE_KEY secret for private dependency access." >&2
            exit 1
          fi

      - name: Create dependencies token
        uses: actions/create-github-app-token@v3
        id: dependencies-token
        with:
          app-id: ${{ secrets.DEPENDENCIES_APP_ID }}
          private-key: ${{ secrets.DEPENDENCIES_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            adi-deploy
            aave-delivery-infrastructure
          permission-contents: read

      - name: Configure private dependency access
        env:
          DEPENDENCIES_TOKEN: ${{ steps.dependencies-token.outputs.token }}
        run: |
          git config --global url."https://x-access-token:${DEPENDENCIES_TOKEN}@github.com/aave/adi-deploy".insteadOf "https://github.com/aave/adi-deploy"
          git config --global url."https://x-access-token:${DEPENDENCIES_TOKEN}@github.com/aave/aave-delivery-infrastructure".insteadOf "https://github.com/aave/aave-delivery-infrastructure"
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Run Pigeon fork tests
        run: ./run-adi-pigeon-fork-test.sh

  gas-diff:
    name: Gas Diff
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: read
    env:
      FOUNDRY_PROFILE: gas
    steps:
      - uses: actions/checkout@v4

      - name: Check dependency access secrets
        env:
          DEPENDENCIES_APP_ID: ${{ secrets.DEPENDENCIES_APP_ID }}
          DEPENDENCIES_PRIVATE_KEY: ${{ secrets.DEPENDENCIES_PRIVATE_KEY }}
        run: |
          if [ -z "$DEPENDENCIES_APP_ID" ] || [ -z "$DEPENDENCIES_PRIVATE_KEY" ]; then
            echo "Missing DEPENDENCIES_APP_ID or DEPENDENCIES_PRIVATE_KEY secret for private dependency access." >&2
            exit 1
          fi

      - name: Create dependencies token
        uses: actions/create-github-app-token@v3
        id: dependencies-token
        with:
          app-id: ${{ secrets.DEPENDENCIES_APP_ID }}
          private-key: ${{ secrets.DEPENDENCIES_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            aave-delivery-infrastructure
          permission-contents: read

      - name: Initialize submodules
        env:
          DEPENDENCIES_TOKEN: ${{ steps.dependencies-token.outputs.token }}
        run: |
          git config --global url."https://x-access-token:${DEPENDENCIES_TOKEN}@github.com/aave/aave-delivery-infrastructure".insteadOf "https://github.com/aave/aave-delivery-infrastructure"
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Run gas tests
        run: forge test

      - name: Upload baseline (master push only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: gas-baseline
          path: snapshots/
          retention-days: 90
          if-no-files-found: error

      - name: Download baseline (PR only)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p baseline
          artifact_id=$(gh api \
            "repos/$REPO/actions/artifacts?name=gas-baseline&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_branch == "master")][0].id // empty')

          if [[ -z "$artifact_id" ]]; then
            echo "::warning::No baseline artifact found yet. PR comment will show current values only."
            exit 0
          fi

          echo "Downloading baseline artifact id=$artifact_id"
          gh api -H "Accept: application/vnd.github+json" \
            "repos/$REPO/actions/artifacts/$artifact_id/zip" \
            > baseline.zip
          unzip -q baseline.zip -d baseline/

          base_sha=$(gh api "repos/$REPO/actions/artifacts/$artifact_id" \
            --jq '.workflow_run.head_sha // empty')
          if [[ -n "$base_sha" ]]; then
            echo "BASE_SHA=$base_sha" >> "$GITHUB_ENV"
          fi

      - name: Generate diff comment (PR only)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        id: diff
        env:
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          comment=$(./.github/workflows/gas-diff.sh baseline snapshots || true)
          if [[ -n "$comment" ]]; then
            {
              echo 'comment<<GAS_DIFF_EOF'
              printf "%s\n" "$comment"
              echo 'GAS_DIFF_EOF'
              echo "has_diff=true"
            } >> "$GITHUB_OUTPUT"
          else
            echo "has_diff=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post / update sticky comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && steps.diff.outputs.has_diff == 'true'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: gas-diff
          message: ${{ steps.diff.outputs.comment }}

      - name: Delete sticky comment if no diff
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && steps.diff.outputs.has_diff == 'false'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: gas-diff
          delete: true
