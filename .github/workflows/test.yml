name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    name: Compile & Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: |
          forge --version

      - name: Run Forge fmt
        run: |
          forge fmt --check
        id: fmt

      - name: Run Forge build
        run: |
          forge build --deny notes --sizes
        id: build

      - name: Check Error Selectors
        run: ./.github/workflows/check-error-selectors.sh

      - name: Run Forge tests
        run: |
          forge test -vvv
        id: test

      - name: Gas Snapshot Report
        if: always()
        run: |
          echo "## Gas Snapshots" >> $GITHUB_STEP_SUMMARY
          for f in snapshots/*.json; do
            [ -f "$f" ] || continue
            echo "### $(basename "$f" .json)" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat "$f" >> $GITHUB_STEP_SUMMARY
            echo '' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          done
