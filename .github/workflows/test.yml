name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  FOUNDRY_PROFILE: ci

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Check Error Selectors
        run: ./.github/workflows/check-error-selectors.sh

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Run Forge build
        run: forge build --deny notes

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: forge-build-cache
          path: |
            out/
            cache/
          retention-days: 1

  sizes:
    name: Sizes
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: forge-build-cache

      - name: Check contract sizes
        run: forge build --sizes

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: forge-build-cache

      - name: Show Forge version
        run: forge --version

      - name: Run Forge tests
        run: forge test -vvv

      - name: Capture updated gas snapshots
        id: snapshots
        if: success() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          if git diff --quiet -- snapshots/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mkdir -p "$RUNNER_TEMP/gas-snapshots"
          cp snapshots/*.json "$RUNNER_TEMP/gas-snapshots/"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Checkout PR head for snapshot update
        if: steps.snapshots.outputs.changed == 'true'
        uses: actions/checkout@v4
        with:
          submodules: recursive
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ github.token }}
          path: pr-head
          fetch-depth: 0

      - name: Commit updated gas snapshots
        id: snapshot_commit
        if: steps.snapshots.outputs.changed == 'true'
        shell: bash
        working-directory: pr-head
        run: |
          mkdir -p snapshots
          cp "$RUNNER_TEMP"/gas-snapshots/*.json snapshots/

          if git diff --quiet -- snapshots/; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshots/
          git commit -m "chore: auto-update gas snapshots"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch follow-up CI for updated branch
        if: steps.snapshot_commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh workflow run test.yml --ref "${{ github.event.pull_request.head.ref }}"
