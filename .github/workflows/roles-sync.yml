name: Roles

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roles-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-validate:
    name: Build & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check dependency access secrets
        env:
          DEPENDENCIES_APP_ID: ${{ secrets.DEPENDENCIES_APP_ID }}
          DEPENDENCIES_PRIVATE_KEY: ${{ secrets.DEPENDENCIES_PRIVATE_KEY }}
        run: |
          if [ -z "$DEPENDENCIES_APP_ID" ] || [ -z "$DEPENDENCIES_PRIVATE_KEY" ]; then
            echo "Missing DEPENDENCIES_APP_ID or DEPENDENCIES_PRIVATE_KEY secret for private dependency access." >&2
            exit 1
          fi

      - name: Create dependencies token
        uses: actions/create-github-app-token@v3
        id: dependencies-token
        with:
          app-id: ${{ secrets.DEPENDENCIES_APP_ID }}
          private-key: ${{ secrets.DEPENDENCIES_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            aave-delivery-infrastructure
          permission-contents: read

      - name: Initialize submodules
        env:
          DEPENDENCIES_TOKEN: ${{ steps.dependencies-token.outputs.token }}
        run: |
          git config --global url."https://x-access-token:${DEPENDENCIES_TOKEN}@github.com/aave/aave-delivery-infrastructure".insteadOf "https://github.com/aave/aave-delivery-infrastructure"
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install JS deps
        run: yarn install --frozen-lockfile

      - name: Build Forge artifacts
        run: forge build --deny notes

      - name: Dump roles per env
        run: yarn roles:dump

      - name: Build canonical roles.json
        run: yarn roles:build

      - name: Validate invariants
        run: yarn roles:validate

      - name: Upload roles.json artifact
        uses: actions/upload-artifact@v4
        with:
          name: roles-json
          path: .github/workflows/tooling/roles-sync/output/roles.json
          retention-days: 7
          if-no-files-found: error

  notion-sync:
    name: Notion Sync
    needs: build-and-validate
    # Notion writes are manual-only to avoid rate-limit flakes blocking CI.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check dependency access secrets
        env:
          DEPENDENCIES_APP_ID: ${{ secrets.DEPENDENCIES_APP_ID }}
          DEPENDENCIES_PRIVATE_KEY: ${{ secrets.DEPENDENCIES_PRIVATE_KEY }}
        run: |
          if [ -z "$DEPENDENCIES_APP_ID" ] || [ -z "$DEPENDENCIES_PRIVATE_KEY" ]; then
            echo "Missing DEPENDENCIES_APP_ID or DEPENDENCIES_PRIVATE_KEY secret for private dependency access." >&2
            exit 1
          fi

      - name: Create dependencies token
        uses: actions/create-github-app-token@v3
        id: dependencies-token
        with:
          app-id: ${{ secrets.DEPENDENCIES_APP_ID }}
          private-key: ${{ secrets.DEPENDENCIES_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            aave-delivery-infrastructure
          permission-contents: read

      - name: Initialize submodules
        env:
          DEPENDENCIES_TOKEN: ${{ steps.dependencies-token.outputs.token }}
        run: |
          git config --global url."https://x-access-token:${DEPENDENCIES_TOKEN}@github.com/aave/aave-delivery-infrastructure".insteadOf "https://github.com/aave/aave-delivery-infrastructure"
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install JS deps
        run: yarn install --frozen-lockfile

      - name: Download roles.json artifact
        uses: actions/download-artifact@v4
        with:
          name: roles-json
          path: .github/workflows/tooling/roles-sync/output/

      - name: Push to Notion
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
        run: yarn roles:notion-sync
