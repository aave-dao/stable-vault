name: Roles

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roles-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-validate:
    name: Build & Validate
    runs-on: ubuntu-latest
    outputs:
      artifact-changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install JS deps
        run: yarn install --frozen-lockfile

      - name: Build Forge artifacts
        run: forge build --deny notes

      - name: Dump roles per env
        run: yarn roles:dump

      - name: Build canonical roles.json
        run: yarn roles:build

      - name: Validate invariants
        run: yarn roles:validate

      - name: Diff against committed artifact
        id: diff
        run: |
          if git diff --quiet -- script/output/roles.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Committed script/output/roles.json is up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::error::script/output/roles.json is stale. Run \`yarn roles:all\` and commit the result."
            git --no-pager diff -- script/output/roles.json
            exit 1
          fi

  notion-sync:
    name: Notion Sync
    needs: build-and-validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install JS deps
        run: yarn install --frozen-lockfile

      - name: Push to Notion
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
        run: yarn roles:notion-sync
